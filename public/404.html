<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — FromSukong</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #101314;
      color: #E8F1F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .wrap { max-width: 480px; }
    .code {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #f97316, #d3c490);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { font-size: 20px; margin: 16px 0 8px; font-weight: 600; }
    p { font-size: 14px; opacity: 0.7; margin-bottom: 24px; line-height: 1.6; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      color: #101314;
      background: #f5f6f7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 24px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    a:hover { transform: scale(0.97); opacity: 0.9; }
    a.ghost { background: transparent; color: #E8F1F6; border: 1px solid rgba(232, 241, 246, 0.3); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist (or moved). Let's get you back on track.</p>
    <div class="links">
      <a href="/">← Back home</a>
      <a class="ghost" href="/about/">About</a>
    </div>
  </div>
</body>
</html>
